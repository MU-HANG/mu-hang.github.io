name: Test a continuous natural reading

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/voice-natural-preview.yml

jobs:
  read-continuously:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Build speech engine
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenblas-dev
          git clone --quiet https://github.com/gabriele-mastrapasqua/qwen3-tts.git "$RUNNER_TEMP/qwen-engine"
          git -C "$RUNNER_TEMP/qwen-engine" checkout --quiet ef339be58a778b062e1c14382347964552eae007
          make -C "$RUNNER_TEMP/qwen-engine" blas -j2 >/dev/null
      - name: Restore voice design model
        uses: actions/cache/restore@v4
        id: model-cache
        with:
          path: ${{ runner.temp }}/qwen-voice-design-model
          key: qwen3-tts-1.7b-voice-design-model-v1
      - name: Generate one unbroken passage
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.model-cache.outputs.cache-hit }}' = 'true'
          mkdir -p voice-natural-preview
          "$RUNNER_TEMP/qwen-engine/qwen_tts" -d "$RUNNER_TEMP/qwen-voice-design-model" --int8 -j4 \
            --voice-design -l Chinese --rate 1.08 --seed 202609292 \
            --instruct "三十岁左右的普通话青年男声，音色温润清亮、干净顺滑，没有沙哑、颗粒感或气泡音。像向一位朋友讲述自己的经历，亲近自然，按句意轻轻起伏，语速接近日常叙述；不要播音腔、刻意煽情或夸张停顿。" \
            --text "有时候，我们以为爱能填满心里的空缺。可当一个人离开，那些没有说出口的话，真的会慢慢消失吗？后来我才明白，遗憾不必急着忘记；能带着它继续好好生活，也是一种温柔。" \
            -o voice-natural-preview/continuous-v2.wav
          test "$(stat -c%s voice-natural-preview/continuous-v2.wav)" -gt 300000
      - uses: actions/upload-artifact@v4
        with:
          name: continuous-natural-reading
          path: voice-natural-preview/continuous-v2.wav
          retention-days: 7
          if-no-files-found: error
