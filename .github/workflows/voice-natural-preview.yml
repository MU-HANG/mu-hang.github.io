name: Test original warm voice with natural narration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/voice-natural-preview.yml

jobs:
  read-continuously:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Build speech engine
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenblas-dev
          git clone --quiet https://github.com/gabriele-mastrapasqua/qwen3-tts.git "$RUNNER_TEMP/qwen-engine"
          git -C "$RUNNER_TEMP/qwen-engine" checkout --quiet ef339be58a778b062e1c14382347964552eae007
          make -C "$RUNNER_TEMP/qwen-engine" blas -j2 >/dev/null
      - name: Restore base voice model
        uses: actions/cache/restore@v4
        id: model-cache
        with:
          path: ${{ runner.temp }}/qwen-base-model
          key: qwen3-tts-1.7b-base-model-v1
      - name: Narrate continuously from selected voice reference
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.model-cache.outputs.cache-hit }}' = 'true'
          mkdir -p voice-natural-preview
          "$RUNNER_TEMP/qwen-engine/qwen_tts" -d "$RUNNER_TEMP/qwen-base-model" --int8 -j4 \
            -l Chinese --rate 1.06 --seed 202609292 \
            --ref-audio .github/voice-reference/v2.wav \
            --ref-text "爱到底是什么？为什么它让我们如此完整，又如此破碎？在靠近另一个人之前，我们先学着与自己的孤独相处。" \
            --text "有时候，我们以为爱能填满心里的空缺。可当一个人离开，那些没有说出口的话，真的会慢慢消失吗？后来我才明白，遗憾不必急着忘记；能带着它继续好好生活，也是一种温柔。" \
            -o voice-natural-preview/selected-v2-base.wav
          test "$(stat -c%s voice-natural-preview/selected-v2-base.wav)" -gt 300000
      - uses: actions/upload-artifact@v4
        with:
          name: selected-v2-base-reading
          path: voice-natural-preview/selected-v2-base.wav
          retention-days: 7
          if-no-files-found: error
