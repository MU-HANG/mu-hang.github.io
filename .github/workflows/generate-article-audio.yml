name: Generate article narration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-article-audio.yml

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        article: ['03', '06', '09', '10', '13', '15', '17', '18', '19', '20', '24', '25', '26', '27', '28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech dependencies
        run: python -m pip install 'kokoro-onnx==0.6.1' 'misaki[zh]' 'lameenc' 'numpy'
      - name: Download and verify the licensed model
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kokoro"
          curl --fail --location --retry 5 --retry-all-errors \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.1-zh.onnx' \
            --output "$RUNNER_TEMP/kokoro/kokoro-v1.1-zh.onnx"
          curl --fail --location --retry 5 --retry-all-errors \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.1-zh.bin' \
            --output "$RUNNER_TEMP/kokoro/voices-v1.1-zh.bin"
          echo '859f9ded9f53be16c24857cdab3254a45da53c3afd5ba6ef134c7de3f822e326  kokoro-v1.1-zh.onnx' |
            (cd "$RUNNER_TEMP/kokoro" && sha256sum --check)
          test "$(stat -c%s "$RUNNER_TEMP/kokoro/voices-v1.1-zh.bin")" -eq 53815880
      - name: Narrate article ${{ matrix.article }}
        run: |
          python scripts/generate-article-audio.py \
            --model-dir "$RUNNER_TEMP/kokoro" \
            --output-dir audio/articles \
            --voice zm_009 --speed 0.94 --threads 4 \
            --article ${{ matrix.article }} --force
      - uses: actions/upload-artifact@v4
        with:
          name: article-audio-${{ matrix.article }}
          path: audio/articles/${{ matrix.article }}.mp3
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: synthesize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: article-audio-*
          path: audio/articles
          merge-multiple: true
      - name: Verify revised article audio
        shell: bash
        run: |
          for id in 03 06 09 10 13 15 17 18 19 20 24 25 26 27 28 29; do
            file="audio/articles/$id.mp3"
            test -s "$file"
            test "$(stat -c%s "$file")" -gt 4096
          done
      - name: Publish audio to this site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/articles/*.mp3
          git commit -m 'Improve narration pauses'
          git push origin HEAD:main
