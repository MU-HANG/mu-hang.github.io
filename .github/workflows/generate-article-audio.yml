name: Generate article narration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-article-audio.yml

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { start: 1, end: 3 }
          - { start: 4, end: 6 }
          - { start: 7, end: 9 }
          - { start: 10, end: 12 }
          - { start: 13, end: 15 }
          - { start: 16, end: 18 }
          - { start: 19, end: 21 }
          - { start: 22, end: 24 }
          - { start: 25, end: 27 }
          - { start: 28, end: 30 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech dependencies
        run: python -m pip install 'kokoro-onnx==0.6.1' 'misaki[zh]' 'lameenc' 'numpy'
      - name: Download and verify the licensed model
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kokoro"
          curl --fail --location --retry 5 --retry-all-errors \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.1-zh.onnx' \
            --output "$RUNNER_TEMP/kokoro/kokoro-v1.1-zh.onnx"
          curl --fail --location --retry 5 --retry-all-errors \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.1-zh.bin' \
            --output "$RUNNER_TEMP/kokoro/voices-v1.1-zh.bin"
          echo '859f9ded9f53be16c24857cdab3254a45da53c3afd5ba6ef134c7de3f822e326  kokoro-v1.1-zh.onnx' |
            (cd "$RUNNER_TEMP/kokoro" && sha256sum --check)
          test "$(stat -c%s "$RUNNER_TEMP/kokoro/voices-v1.1-zh.bin")" -eq 53815880
      - name: Narrate articles ${{ matrix.start }} to ${{ matrix.end }}
        run: |
          python scripts/generate-article-audio.py \
            --model-dir "$RUNNER_TEMP/kokoro" \
            --output-dir audio/articles \
            --voice zm_009 --speed 0.94 --threads 4 \
            --start-number ${{ matrix.start }} --end-number ${{ matrix.end }}
      - uses: actions/upload-artifact@v4
        with:
          name: article-audio-${{ matrix.start }}
          path: audio/articles/*.mp3
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: synthesize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: article-audio-*
          path: audio/articles
          merge-multiple: true
      - name: Verify all article audio
        shell: bash
        run: |
          test "$(find audio/articles -maxdepth 1 -name '*.mp3' | wc -l)" -eq 30
          for file in audio/articles/*.mp3; do test "$(stat -c%s "$file")" -gt 4096; done
      - name: Publish audio to this site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/articles/*.mp3
          git commit -m 'Add 30 article narrations'
          git push origin HEAD:main
